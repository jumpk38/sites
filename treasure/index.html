<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>はばたきストア - 特製ソース注文</title>
    <style>
        :root {
            --primary-color: #f39c12;
            --bg-color: #fff9e6;
            --btn-default: #ffffff;
            --btn-active: #e67e22;
        }
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
        }
        .container {
            max-width: 400px;
            width: 100%;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 { font-size: 1.5rem; color: #d35400; margin-bottom: 10px; }
        p { font-size: 0.9rem; margin-bottom: 20px; line-height: 1.4; }

        /* アイテム選択ボタン */
        .item-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 25px;
        }
        .item-btn {
            background: var(--btn-default);
            border: 2px solid #ddd;
            border-radius: 12px;
            padding: 15px 10px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80px;
        }
        .item-btn.active {
            background: var(--btn-active);
            color: white;
            border-color: #d35400;
            transform: scale(1.05);
        }

        /* 数量入力 */
        .input-group { margin-bottom: 25px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 1rem; }
        input[type="number"] {
            width: 80%;
            padding: 15px;
            font-size: 1.5rem;
            text-align: center;
            border: 2px solid #ddd;
            border-radius: 10px;
            outline: none;
        }

        /* 注文ボタン */
        .order-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            box-shadow: 0 4px 0 #1e8449;
            cursor: pointer;
            width: 100%;
        }
        .order-btn:active { transform: translateY(2px); box-shadow: none; }

        /* 成功・失敗メッセージ */
        #result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 20px;
            box-sizing: border-box;
        }
        .success-img { font-size: 100px; margin-bottom: 20px; animation: glow 1s ease-in-out infinite alternate; }
        @keyframes glow { from { text-shadow: 0 0 10px #fff, 0 0 20px #f39c12; } to { text-shadow: 0 0 20px #fff, 0 0 30px #ffcc00; } }
        .error-text { color: #ff6b6b; font-weight: bold; margin-top: 10px; height: 20px; font-size: 0.85rem; }
    </style>
</head>
<body>

<div class="container" id="main-ui">
    <h1>注文パネル</h1>
    <p>料理長のメモをよく読んで、<br>ほしい商品と分量（g）を入れてね！</p>

    <div class="item-grid" id="item-grid">
        <button class="item-btn" onclick="selectItem(0, this)">照葉ガーリック<br>オイル</button>
        <button class="item-btn" onclick="selectItem(1, this)">給食室の<br>まほうの塩</button>
        <button class="item-btn" onclick="selectItem(2, this)">はばたきパウダー<br>入りソース</button>
        <button class="item-btn" onclick="selectItem(3, this)">校長先生の<br>ひみつのサトウ</button>
    </div>

    <div class="input-group">
        <label for="quantity">分量（グラム）をいれてね</label>
        <input type="number" id="quantity" placeholder="0000" inputmode="numeric">
        <div id="error-msg" class="error-text"></div>
    </div>

    <button class="order-btn" onclick="checkOrder()">ちゅうもんを確定する</button>
</div>

<div id="result-overlay">
    <div class="success-img">🍯✨</div>
    <h2 style="color: #f1c40f;">注文成功！</h2>
    <p style="font-size: 1.1rem; text-align: center;">「黄金のはばたきソース」を手に入れた！<br><br>この画面を「配膳係（ゴール）」に見せてね！</p>
    <button onclick="closeOverlay()" style="margin-top: 30px; background: none; border: 1px solid white; color: white; padding: 5px 15px; border-radius: 5px;">もどる</button>
</div>

<script>
    let selectedItemIndex = -1;

    function selectItem(index, element) {
        selectedItemIndex = index;
        const buttons = document.querySelectorAll('.item-btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
        document.getElementById('error-msg').innerText = ""; // メッセージクリア
    }

    function checkOrder() {
        const quantity = document.getElementById('quantity').value;
        const errorMsg = document.getElementById('error-msg');
        
        // バリデーション
        if (selectedItemIndex === -1) {
            errorMsg.innerText = "★ほしい商品を選んでね！";
            return;
        }

        if (selectedItemIndex !== 2) {
            errorMsg.innerText = "★商品がちがうようだ（メモを読もう）";
            return;
        }

        if (quantity != 2005) {
            errorMsg.innerText = "★分量がちがうようだ（ポスターを見よう）";
            return;
        }

        // すべて正解
        showSuccess();
    }

    function showSuccess() {
        document.getElementById('result-overlay').style.display = 'flex';
        // 演出としてバイブレーション（スマホのみ）
        if (navigator.vibrate) { navigator.vibrate([100, 50, 100]); }
    }

    function closeOverlay() {
        document.getElementById('result-overlay').style.display = 'none';
    }
</script>

</body>
</html>
