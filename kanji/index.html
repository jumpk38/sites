<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>スイスイ漢字道場</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            touch-action: none; /* Prevent scroll/zoom for Apple Pencil */
            overflow: hidden;
            background-color: #f0fdf4; /* Light green for a pleasant vibe */
            user-select: none;
            -webkit-user-select: none;
        }
        
        .kanji-font {
            font-family: 'UD Digi Kyokasho N-R', 'UD Digi Kyokasho', 'Yu Kyokasho', 'YuKyokasho', 'Klee One', cursive;
        }

        #character-target-div {
            position: relative;
            width: 400px;
            height: 400px;
            margin: 0 auto;
            background-color: white;
            border-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease-out;
        }

        #character-target-div.shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.6);
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-3px, 0, 0); }
            20%, 80% { transform: translate3d(5px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-10px, 0, 0); }
            40%, 60% { transform: translate3d(10px, 0, 0); }
        }

        .grid-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .grid-lines line {
            stroke: #e5e7eb;
            stroke-width: 2;
            stroke-dasharray: 8 8;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            animation: pop 0.8s cubic-bezier(0.1, 0.8, 0.2, 1) forwards;
        }

        @keyframes pop {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1); opacity: 0; }
        }
        
        .card-container {
            perspective: 1200px;
        }
        
        .card-enter {
            animation: cardEnter 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
        
        @keyframes cardEnter {
            from { opacity: 0; transform: translateX(60px) rotateY(-15deg) scale(0.95); }
            to { opacity: 1; transform: translateX(0) rotateY(0) scale(1); }
        }

        #hanzi-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            border-radius: 24px;
            overflow: hidden;
        }

        .start-screen-bg {
            background: linear-gradient(135deg, #3b82f6 0%, #10b981 100%);
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-between py-6">

    <!-- Start Screen (For Web Audio API init) -->
    <div id="start-screen" class="fixed inset-0 start-screen-bg z-50 flex flex-col items-center justify-center text-white transition-opacity duration-500">
        <h1 class="text-5xl font-bold mb-4 drop-shadow-md tracking-wider">スイスイ漢字道場</h1>
        <p class="text-xl mb-12 opacity-90">小学1〜3年生 ・ リズムで覚える書き順</p>
        <button id="btn-start" class="bg-white text-blue-600 font-bold py-5 px-16 rounded-full shadow-xl text-2xl hover:scale-105 active:scale-95 transition-transform">
            はじめる
        </button>
    </div>

    <!-- Header: Progress -->
    <div class="w-full max-w-2xl px-6 flex flex-col items-center gap-3">
        <div class="flex justify-between w-full items-end">
            <h1 class="text-2xl font-bold text-green-700 tracking-wide">スイスイ漢字道場</h1>
            <p class="text-lg text-green-600 font-bold bg-green-100 px-4 py-1 rounded-full shadow-sm">
                <span id="current-index" class="text-2xl">1</span> / <span id="total-kanji">10</span>
            </p>
        </div>
        <div class="w-full bg-white rounded-full h-5 p-1 shadow-inner relative overflow-hidden">
            <div id="progress-bar" class="bg-gradient-to-r from-green-400 to-blue-500 h-full rounded-full transition-all duration-500 ease-out w-0 shadow"></div>
        </div>
    </div>

    <!-- Main Card -->
    <div class="card-container flex-1 flex flex-col items-center justify-center w-full my-4">
        <div id="card" class="relative flex flex-col items-center">
            <div id="character-target-div">
                <div id="grade-label-badge" class="absolute -top-4 left-1/2 transform -translate-x-1/2 bg-yellow-400 text-yellow-900 font-bold px-5 py-1.5 rounded-full shadow-md z-20 text-sm whitespace-nowrap tracking-wide border-2 border-white transition-colors duration-300">
                    1年生で習う漢字
                </div>
                <svg class="grid-lines" id="grid-lines" xmlns="http://www.w3.org/2000/svg" width="400" height="400">
                    <line x1="200" y1="0" x2="200" y2="400" />
                    <line x1="0" y1="200" x2="400" y2="200" />
                </svg>
                <div id="hanzi-container"></div>
            </div>
            
            <!-- Readings display -->
            <div class="mt-5 w-[400px] bg-white rounded-2xl p-4 shadow-md border border-gray-100 flex flex-col gap-2 min-h-[5.5rem] relative z-20">
                <div class="flex items-start gap-3">
                    <span class="bg-blue-100 text-blue-700 text-sm font-bold px-3 py-1 rounded-lg shrink-0 w-12 text-center shadow-sm">音</span>
                    <span id="on-readings" class="text-gray-700 font-bold text-lg leading-relaxed flex-1 tracking-wider"></span>
                </div>
                <div class="flex items-start gap-3">
                    <span class="bg-orange-100 text-orange-800 text-sm font-bold px-3 py-1 rounded-lg shrink-0 w-12 text-center shadow-sm">訓</span>
                    <span id="kun-readings" class="text-gray-700 font-bold text-lg leading-relaxed flex-1 tracking-wider"></span>
                </div>
            </div>

            <div id="particles-container" class="absolute top-0 left-0 w-full h-[400px] pointer-events-none z-10"></div>
        </div>
    </div>

    <!-- Navigation -->
    <div class="w-full max-w-2xl px-6 flex justify-between items-center pb-6">
        <button id="btn-prev" class="bg-white text-gray-600 font-bold py-5 px-8 rounded-2xl shadow-md border-b-4 border-gray-200 active:border-b-0 active:translate-y-1 hover:bg-gray-50 transition-all flex items-center gap-2 text-xl">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" /></svg>
            前へ
        </button>
        
        <div class="kanji-font text-5xl text-gray-800 font-bold drop-shadow-sm" id="current-kanji-display">
            <!-- kanji text -->
        </div>

        <button id="btn-next" class="bg-blue-500 text-white font-bold py-5 px-8 rounded-2xl shadow-md border-b-4 border-blue-600 active:border-b-0 active:translate-y-1 hover:bg-blue-400 transition-all flex items-center gap-2 text-xl">
            次へ
            <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7" /></svg>
        </button>
    </div>

    <script>
        // Data & State (小学1〜3年生の漢字)
        const GRADE_1 = "一右雨円王音下火花貝学気九休玉金空月犬見五口校左三山子四糸字耳七車手十出女小上森人水正生青夕石赤千川先早草足村大男竹中虫町天田土二日入年白八百文木本名目立力林六".split('');
        const GRADE_2 = "引羽雲園遠何科夏家歌画回会海絵外角楽活間丸岩顔汽記帰弓牛魚京強教近兄形計元言原戸古午後語工公広交光考行高黄合谷国黒今才細作算止市矢姉思紙寺自時室社弱首秋週春書少場色食心新親図数西声星晴切雪船線前組走多太体台地池知茶昼長鳥朝直通弟店点電刀冬当東答頭同道読内南肉馬売買麦半番父風分聞米歩母方北毎妹万明鳴毛門夜野友用曜来里理話".split('');
        const GRADE_3 = "悪安暗医委意育員院飲運泳駅央横屋温化荷界開階寒感漢館岸起期客究急級宮球去橋業曲局銀区苦具君係軽血決研県庫湖向幸港号根祭皿仕死使始指歯詩次事持式実写者主守取酒受州拾終習集住重宿所暑助昭消商章勝乗植申身神真深進世整昔全相送想息速族他打対待代第題炭短談着注柱丁帳調追定庭笛鉄転都度投豆島湯登等動童農波配倍箱畑発反坂板皮悲美鼻筆氷表秒病品負部服福物平返勉放味命面問役薬由油有遊予羊洋葉陽様落流旅両緑礼列練路和".split('');

        let allKanjiPool = [];
        GRADE_1.forEach(char => allKanjiPool.push({ char, grade: '1年生で習う漢字' }));
        GRADE_2.forEach(char => allKanjiPool.push({ char, grade: '2年生で習う漢字' }));
        GRADE_3.forEach(char => allKanjiPool.push({ char, grade: '3年生で習う漢字' }));

        // シャッフル
        allKanjiPool.sort(() => 0.5 - Math.random());
        // 15問選定
        const SESSION_KANJI = allKanjiPool.slice(0, 15);

        let currentIndex = 0;
        let writer = null;
        let clearedIndices = new Set();
        let isGameCleared = false;
        
        // 連続正解数のトラッキング（十字ガイドを消すため）
        const kanjiStats = {}; 
        SESSION_KANJI.forEach(k => kanjiStats[k.char] = 0);

        // Web Audio API
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') return; // Should not happen after start
            
            const now = audioCtx.currentTime;
            
            if (type === 'stroke') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1000, now);
                osc.frequency.exponentialRampToValueAtTime(1500, now + 0.1);
                
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.1);
                
            } else if (type === 'success') {
                // キラキラしたアルペジオ
                const frequencies = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                frequencies.forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    
                    const time = now + (i * 0.08);
                    osc.frequency.setValueAtTime(freq, time);
                    
                    gain.gain.setValueAtTime(0, time);
                    gain.gain.linearRampToValueAtTime(0.2, time + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.01, time + 0.5);
                    
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(time);
                    osc.stop(time + 0.5);
                });
                
            } else if (type === 'error') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.2);
                
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.2);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.2);
            }
        }

        function createParticles() {
            const container = document.getElementById('particles-container');
            const colors = ['#FCD34D', '#F472B6', '#60A5FA', '#34D399', '#A78BFA'];
            
            for (let i = 0; i < 40; i++) {
                const p = document.createElement('div');
                p.classList.add('particle');
                
                const size = Math.random() * 12 + 6;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                
                p.style.left = '50%';
                p.style.top = '50%';
                
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 150 + 80;
                const tx = Math.cos(angle) * distance + 'px';
                const ty = Math.sin(angle) * distance + 'px';
                
                p.style.setProperty('--tx', tx);
                p.style.setProperty('--ty', ty);
                
                container.appendChild(p);
                
                setTimeout(() => p.remove(), 800);
            }
        }

        function fireCrackers() {
            const duration = 3000;
            const end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0, y: 0.8 },
                    colors: ['#26ccff', '#a25afd', '#ff5e7e', '#88ff5a', '#fcff42', '#ffa62d', '#ff36ff']
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1, y: 0.8 },
                    colors: ['#26ccff', '#a25afd', '#ff5e7e', '#88ff5a', '#fcff42', '#ffa62d', '#ff36ff']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
            
            // クリアメッセージ表示
            const clearMsg = document.createElement('div');
            clearMsg.className = 'fixed inset-0 z-50 flex items-center justify-center pointer-events-none';
            clearMsg.innerHTML = '<h1 class="text-6xl md:text-8xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 via-red-500 to-pink-500 drop-shadow-xl" style="animation: pop 0.8s cubic-bezier(0.1, 0.8, 0.2, 1) forwards;">道場クリア！</h1>';
            document.body.appendChild(clearMsg);
        }

        function renderKanji(animateIn = true) {
            const currentItem = SESSION_KANJI[currentIndex];
            const char = currentItem.char;
            const targetDiv = document.getElementById('character-target-div');
            const hanziContainer = document.getElementById('hanzi-container');
            
            if (animateIn) {
                const card = document.getElementById('card');
                card.classList.remove('card-enter');
                void card.offsetWidth; // force reflow
                card.classList.add('card-enter');
            }

            // UI更新
            document.getElementById('current-kanji-display').textContent = char;
            document.getElementById('grade-label-badge').textContent = currentItem.grade;
            document.getElementById('current-index').textContent = currentIndex + 1;
            document.getElementById('total-kanji').textContent = SESSION_KANJI.length;
            
            // 音訓読みの取得と表示
            const onReadingsEl = document.getElementById('on-readings');
            const kunReadingsEl = document.getElementById('kun-readings');
            onReadingsEl.textContent = '...';
            kunReadingsEl.textContent = '...';
            
            fetch('https://kanjiapi.dev/v1/kanji/' + encodeURIComponent(char))
                .then(res => res.json())
                .then(data => {
                    onReadingsEl.textContent = data.on_readings.length > 0 ? data.on_readings.join('、') : '（なし）';
                    // 送り仮名のドット表現（例: ひと.しい）を取り除くなど整形
                    const kun = data.kun_readings.map(r => r.replace('.', '')).join('、');
                    kunReadingsEl.textContent = kun.length > 0 ? kun : '（なし）';
                })
                .catch(err => {
                    console.error('Failed to fetch kanji readings', err);
                    onReadingsEl.textContent = '取得できませんでした';
                    kunReadingsEl.textContent = '取得できませんでした';
                });
            
            // 進捗バーはクリアした数で計算
            document.getElementById('progress-bar').style.width = `${(clearedIndices.size / SESSION_KANJI.length) * 100}%`;

            // クリア済み問題の場合はバッジの色を変える
            if (clearedIndices.has(currentIndex)) {
                document.getElementById('grade-label-badge').classList.replace('bg-yellow-400', 'bg-green-400');
                document.getElementById('grade-label-badge').classList.replace('text-yellow-900', 'text-green-900');
                document.getElementById('grade-label-badge').textContent += " (クリア済)";
            } else {
                document.getElementById('grade-label-badge').classList.replace('bg-green-400', 'bg-yellow-400');
                document.getElementById('grade-label-badge').classList.replace('text-green-900', 'text-yellow-900');
            }

            // ガイドライン（十字）の透明度
            const gridLines = document.getElementById('grid-lines');
            if (kanjiStats[char] >= 3) {
                gridLines.style.opacity = '0';
            } else {
                gridLines.style.opacity = '1';
            }

            // HanziWriter 初期化
            hanziContainer.innerHTML = '';
            writer = HanziWriter.create('hanzi-container', char, {
                width: 400,
                height: 400,
                padding: 20,
                showOutline: true, // 青色のストロークと同一のSVGパスでアウトラインを描画する
                strokeAnimationSpeed: 2,
                delayBetweenStrokes: 50,
                strokeColor: '#3B82F6', // Blue-500
                highlightColor: '#EF4444', // Red-500
                outlineColor: '#E5E7EB', // Gray-200
                drawingWidth: 28, // Apple Pencil向けに少し太め
                drawingColor: '#1E3A8A', // Blue-900
                charDataLoader: function(char, onLoad, onError) {
                    fetch('https://cdn.jsdelivr.net/npm/hanzi-writer-data-jp@0/' + char + '.json')
                        .then(res => res.json())
                        .then(onLoad)
                        .catch(onError);
                }
            });

            writer.quiz({
                onMistake: () => {
                    playSound('error');
                    targetDiv.classList.remove('shake');
                    void targetDiv.offsetWidth;
                    targetDiv.classList.add('shake');
                    // ミスしたら連続正解リセット
                    kanjiStats[char] = 0;
                    gridLines.style.opacity = '1';
                },
                onCorrectStroke: () => {
                    playSound('stroke');
                    targetDiv.classList.remove('shake');
                },
                onComplete: (summaryData) => {
                    playSound('success');
                    createParticles();
                    
                    if (summaryData.totalMistakes === 0) {
                        kanjiStats[char]++;
                    }

                    clearedIndices.add(currentIndex);
                    document.getElementById('progress-bar').style.width = `${(clearedIndices.size / SESSION_KANJI.length) * 100}%`;

                    // 次の漢字へ自動遷移、または全問クリア判定
                    setTimeout(() => {
                        if (clearedIndices.size === SESSION_KANJI.length && !isGameCleared) {
                            isGameCleared = true;
                            fireCrackers();
                        } else if (!isGameCleared) {
                            // まだクリアしていない問題を探して遷移する
                            if (clearedIndices.size < SESSION_KANJI.length) {
                                let nextIndex = currentIndex + 1;
                                while(nextIndex < SESSION_KANJI.length && clearedIndices.has(nextIndex)) {
                                    nextIndex++;
                                }
                                if (nextIndex >= SESSION_KANJI.length) {
                                    // 最後まで到達したら最初から探す
                                    nextIndex = 0;
                                    while(nextIndex < currentIndex && clearedIndices.has(nextIndex)) {
                                        nextIndex++;
                                    }
                                }
                                currentIndex = nextIndex;
                                renderKanji();
                            }
                        }
                    }, 1500);
                }
            });
        }

        // イベントリスナー
        document.getElementById('btn-start').addEventListener('click', () => {
            const startScreen = document.getElementById('start-screen');
            startScreen.style.opacity = '0';
            setTimeout(() => {
                startScreen.style.display = 'none';
            }, 500);
            
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            renderKanji(true);
        });

        document.getElementById('btn-prev').addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                renderKanji(true);
            }
        });

        document.getElementById('btn-next').addEventListener('click', () => {
            if (currentIndex < SESSION_KANJI.length - 1) {
                currentIndex++;
                renderKanji(true);
            }
        });

    </script>
</body>
</html>
